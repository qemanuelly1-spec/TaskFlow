<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Gerenciador de Tarefas</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">
      <i class="bi bi-check2-square"></i> TaskFlow
    </span>
  </div>
</nav>

<div class="container">

  <!-- Alertas -->
  <div id="alertContainer"></div>

  <!-- Formulário de criação/edição -->
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <h5 class="card-title" id="formTitle">Nova tarefa</h5>
      <form id="tarefaForm">
        <input type="hidden" id="tarefaId">
        <div class="mb-3">
          <label for="titulo" class="form-label">Título</label>
          <input type="text" class="form-control" id="titulo" required maxlength="100" placeholder="Ex: Estudar ASP.NET Core">
        </div>
        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição</label>
          <textarea class="form-control" id="descricao" rows="2" placeholder="Detalhes da tarefa (opcional)"></textarea>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="concluida">
          <label class="form-check-label" for="concluida">Já concluída</label>
          <div class="mb-3">
  <label for="prioridade" class="form-label">Prioridade</label>
  <select class="form-select" id="prioridade">
    <option value="0">Baixa</option>
    <option value="1" selected>Média</option>
    <option value="2">Alta</option>
  </select>
</div>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <i class="bi bi-plus-lg"></i> Adicionar tarefa
        </button>
        <button type="button" class="btn btn-secondary d-none" id="cancelEditBtn">
          Cancelar edição
        </button>
      </form>
    </div>
  </div>

  <!-- Filtros -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">Minhas tarefas</h5>
    <div class="btn-group" role="group" aria-label="Filtros">
      <button type="button" class="btn btn-outline-primary filtro-btn active" data-filtro="todas">Todas</button>
      <button type="button" class="btn btn-outline-primary filtro-btn" data-filtro="pendentes">Pendentes</button>
      <button type="button" class="btn btn-outline-primary filtro-btn" data-filtro="concluidas">Concluídas</button>
    </div>
  </div>

  <!-- Lista de tarefas -->
  <div id="listaTarefas" class="list-group mb-5">
    <!-- Preenchido via JavaScript -->
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/tarefas.js"></script>
</body>
</html>
